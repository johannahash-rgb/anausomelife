name: Repair mall article publishing registration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-mall-journal-registration.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Prepare the mall story using the existing editorial builders
        run: |
          python -m pip install --quiet lxml Pillow
          python - <<'PY'
          import importlib.util, json, math, re
          from pathlib import Path
          from lxml import html
          root=Path('.').resolve()
          slug='the-beautiful-art-of-going-to-the-mall.html'
          url='/'+slug
          def module(name,path):
              spec=importlib.util.spec_from_file_location(name,root/path)
              obj=importlib.util.module_from_spec(spec);spec.loader.exec_module(obj);return obj
          se=module('site_experience','.github/scripts/site_experience.py')
          cb=module('collection_browse','.github/scripts/collection_browse.py')
          simple=module('page_simplicity','.github/scripts/page_simplicity.py')
          doc=html.document_fromstring((root/slug).read_text())
          title=doc.xpath('//h1')[0].text_content().strip()
          summary=doc.xpath('//meta[@name="description"]/@content')[0]
          image='/assets/mall-over-the-years/whitney-field-community.jpeg'
          assert len(doc.xpath('//figure[contains(@class,"mall-family-photo")]//img'))==5
          library_path=root/'data/library.json'
          library=json.loads(library_path.read_text())
          record={'slug':slug[:-5],'url':url,'title':title,'summary':summary,'category':'stories','format':'Story','minutes':6,'image':image,'search':'Searstown Mall at Whitney Field Leominster family mall photographs over the years teenager belonging communication choices ordinary outings'}
          existing=next((r for r in library if r['url']==url),None)
          if existing is None:library.insert(0,record)
          else:existing.update(record)
          library_path.write_text(json.dumps(library,ensure_ascii=False,indent=2)+'\n')
          taxpath=root/'data/journal-taxonomy.json'
          tax=json.loads(taxpath.read_text());entries=tax['entries'];tags=entries.pop(url)
          ordered={}
          for key,value in entries.items():
              ordered[key]=value
              if key=='/menauhant-beach-the-art-of-letting-go.html':ordered[url]=tags
          assert url in ordered
          tax['entries']=ordered
          taxpath.write_text(json.dumps(tax,ensure_ascii=False,indent=2)+'\n')
          rows_path=root/'data/page-directory.json'
          rows=json.loads(rows_path.read_text())
          row={'url':url,'path':slug,'title':title,'summary':summary,'section':'journal','category':'stories','format':'Story','image':image,'minutes':6,'topics':[tax['topics'][t] for t in tags['topics']]}
          rows=[r for r in rows if r['url']!=url]+[row]
          docs=se.documents(root)
          chapters=json.loads((root/'data/site-structure.json').read_text())['chapters']
          cb.prepare(root,docs,rows)
          for name in [slug,'blog.html']:
              page=docs[name]
              current=row if name==slug else next(r for r in rows if r['path']==name)
              se.apply_shell(page,name,current,chapters)
              simple.apply(page,name)
              (root/name).write_text(se.render(page))
          se.build_library(docs['library.html'],rows)
          simple.apply(docs['library.html'],'library.html')
          (root/'library.html').write_text(se.render(docs['library.html']))
          se.build_map(root,docs,rows,chapters)
          current=next(r for r in rows if r['path']=='site-map.html')
          se.apply_shell(docs['site-map.html'],'site-map.html',current,chapters)
          simple.apply(docs['site-map.html'],'site-map.html')
          (root/'site-map.html').write_text(se.render(docs['site-map.html']))
          rows_path.write_text(json.dumps(rows,ensure_ascii=False,separators=(',',':'))+'\n')
          print('Registered mall article; preserved the five original photos and existing journal pins.')
          PY
          python tools/build_site_index.py
      - name: Validate the repaired article integration
        run: |
          python tests/test_site_experience.py
          python tests/test_page_simplicity.py
          python tests/test_reader_pathways.py
          python tests/test_growth_readiness.py
          python tests/test_reader_growth.py
          python tools/check_editorial_rights.py
          python tools/check_story_sharing.py
      - name: Save only the requested article and its publishing indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add the-beautiful-art-of-going-to-the-mall.html blog.html library.html site-map.html data/library.json data/journal-taxonomy.json data/page-directory.json data/site-index.json
          if git diff --cached --quiet; then
            echo 'No registration changes needed.'
          else
            git commit -m 'Complete mall photo essay navigation, library registration and journal placement'
            git push origin HEAD:main
          fi
