name: Complete mall family-photo upload

on:
  push:
    branches: [main]
    paths: ['.github/workflows/complete-mall-photo-upload.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mall-photo-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Import the five authorized original photographs and embed the gallery
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, html, json, re, urllib.request
          from pathlib import Path
          from datetime import datetime, timezone
          root = Path('.')
          slug = 'the-beautiful-art-of-going-to-the-mall.html'
          folder = root / 'assets/mall-over-the-years'
          folder.mkdir(parents=True, exist_ok=True)
          photos = [
              {'name':'whitney-field-community.jpeg','source':'IMG_1547.jpeg','url':'https://at.adobe.com/bkloyKK1bnLOcOHV','sha256':'2c645fbc0b57edf551de9da6aac1dd8a4614459b6f4061fbc45e476206e5c490','alt':'James holding his blue tablet case beside the Leominster community mural.','caption':'Back at my childhood mall: Searstown then, the Mall at Whitney Field now.'},
              {'name':'mall-pause-together.jpeg','source':'IMG_9519(1).jpeg','url':'https://at.adobe.com/UtWDW5i7O1LHx5w6','sha256':'be6d0ee98b08ef6ce036bbce4780d0f8409f912a5e283bd2d1ec55723f931bb1','alt':'A mother and son, seen from behind, pausing together beside a recessed opening in a marble mall wall.','caption':'A pause together on one of our mall afternoons.'},
              {'name':'holiday-mall-afternoon.jpeg','source':'IMG_0188.jpeg','url':'https://at.adobe.com/nJe0HnyfjTdeC2ha','sha256':'cf46d5d5a45c3e96a712742a4b4028a2bfec9c931dac784003b65ab522cd8496','alt':'James seated at a mall food-court table with holiday decorations behind him.','caption':'A holiday-season stop, from an earlier family outing.'},
              {'name':'easter-bunny-2024.jpeg','source':'IMG_5570.jpeg','url':'https://at.adobe.com/1FsHPzuYtJLBKK74','sha256':'7cffed99fd8d4870fe52584ae0dc2089e2c086a6a9f1b2c35f9557c955b9bef6','alt':'A printed 2024 portrait of James smiling beside the Easter Bunny.','caption':'An Easter Bunny visit, 2024.'},
              {'name':'carousel-with-dad.jpeg','source':'IMG_0927.jpeg','url':'https://at.adobe.com/6ZvG5MjBw7hWISPr','sha256':'aa1e0167c93b528be2e5b20361583691178e8b9df63b95a4e5e2416ab68294eb','alt':'Michael and James seated together in a carousel carriage beneath strings of lights.','caption':'A carousel ride with Dad: another afternoon worth keeping.'}
          ]
          for photo in photos:
              destination = folder / photo['name']
              if destination.exists() and hashlib.sha256(destination.read_bytes()).hexdigest() == photo['sha256']:
                  data = destination.read_bytes()
              else:
                  request = urllib.request.Request(photo['url'], headers={'User-Agent':'An-AUsome-Life-authorized-photo-publisher'})
                  with urllib.request.urlopen(request, timeout=90) as response:
                      data = response.read(10000001)
                  if not data.startswith(b'\xff\xd8\xff'):
                      raise RuntimeError('The download was not a JPEG: ' + photo['name'])
                  if hashlib.sha256(data).hexdigest() != photo['sha256']:
                      raise RuntimeError('Original-photo integrity check failed: ' + photo['name'])
                  destination.write_bytes(data)
              print('Verified original JPEG:', destination, len(data), 'bytes')
          def figure(photo, hero=False):
              src = '/assets/mall-over-the-years/' + photo['name']
              loading = 'loading="eager" fetchpriority="high"' if hero else 'loading="lazy"'
              return '<figure class="mall-family-photo' + (' mall-family-hero' if hero else '') + '"><a href="' + src + '" target="_blank" rel="noopener noreferrer" aria-label="View full photograph: ' + html.escape(photo['alt'], quote=True) + '"><img src="' + src + '" width="1152" height="1536" alt="' + html.escape(photo['alt'], quote=True) + '" ' + loading + ' decoding="async"></a><figcaption>' + html.escape(photo['caption']) + '</figcaption></figure>'
          path = root / slug
          page = path.read_text(encoding='utf-8')
          if 'id="mall-photo-gallery"' not in page:
              page, count = re.subn(r'(<p class="mall-dek">.*?</p>)', lambda m: m.group(1) + '\n' + figure(photos[0], True), page, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError('Could not find the existing article introduction; refusing a guessed edit.')
              note = '<p class="mall-album-note"><strong>Mall Photos Over the Years.</strong> These photographs come from different malls and different years, not all from Whitney Field. Together, they are a little album of our family\u2019s mall afternoons.</p>'
              page, count = re.subn(r'<p><em>A note on the photographs accompanying this story:</em>.*?</p>', note, page, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError('Could not find the existing photograph-provenance note.')
              page = page.replace('<h2>The photographs I am grateful we took</h2>', '<h2 id="mall-photos-over-the-years">Mall Photos Over the Years</h2>', 1)
              gallery = '<div id="mall-photo-gallery" class="mall-photo-grid" role="group" aria-labelledby="mall-photos-over-the-years">' + ''.join(figure(photo) for photo in photos[1:]) + '</div>\n'
              anchor = '<h2>Back to Searstown, and forward with James</h2>'
              if page.count(anchor) != 1:
                  raise RuntimeError('Could not find the gallery insertion point.')
              page = page.replace(anchor, gallery + anchor, 1)
              css = '<style id="mall-photos-style">.mall-story figure.mall-family-photo{margin:24px 0;padding:0;background:transparent}.mall-story figure.mall-family-hero{max-width:560px;margin:28px auto 36px}.mall-family-photo a{display:block}.mall-family-photo img{display:block;width:100%;height:auto;border-radius:12px}.mall-family-photo figcaption{font:15px/1.6 system-ui,sans-serif;color:#51625d;padding:10px 2px 0;text-align:left}.mall-photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start;margin:24px 0 40px}.mall-story .mall-photo-grid figure.mall-family-photo{margin:0}.mall-album-note{font-size:16px;line-height:1.65;background:#eaf0eb;padding:16px 20px;border-radius:10px}.mall-family-photo a:focus-visible{outline:3px solid #225e6b;outline-offset:5px}@media(max-width:560px){.mall-photo-grid{grid-template-columns:1fr;gap:28px}.mall-story figure.mall-family-hero{max-width:100%}}</style>'
              page = page.replace('</head>', css + '\n</head>', 1)
          hero_url = 'https://anausomelife.com/assets/mall-over-the-years/' + photos[0]['name']
          page = re.sub(r'<meta (?:property|name)="(?:og:image(?::(?:secure_url|width|height|type|alt))?|twitter:(?:card|image(?::alt)?))"[^>]*>\s*', '', page)
          meta = '<meta property="og:image" content="' + hero_url + '"><meta property="og:image:width" content="1152"><meta property="og:image:height" content="1536"><meta property="og:image:alt" content="' + html.escape(photos[0]['alt'], quote=True) + '"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="' + hero_url + '"><meta name="twitter:image:alt" content="' + html.escape(photos[0]['alt'], quote=True) + '">'
          page = page.replace('</head>', meta + '\n</head>', 1)
          def enrich_schema(match):
              data = json.loads(match.group(1))
              if data.get('@type') == 'BlogPosting':
                  data['image'] = ['https://anausomelife.com/assets/mall-over-the-years/' + p['name'] for p in photos]
                  data['dateModified'] = datetime.now(timezone.utc).date().isoformat()
              return '<script type="application/ld+json">' + json.dumps(data, ensure_ascii=False) + '</script>'
          page = re.sub(r'<script type="application/ld\+json">(.*?)</script>', enrich_schema, page, flags=re.S)
          for photo in photos:
              if 'src="/assets/mall-over-the-years/' + photo['name'] + '"' not in page:
                  raise RuntimeError('A photograph is missing from the final HTML: ' + photo['name'])
          path.write_text(page, encoding='utf-8')
          blog_path = root / 'blog.html'
          blog = blog_path.read_text(encoding='utf-8')
          card_pattern = r'<li\b[^>]*data-collection-card[^>]*data-url="/' + re.escape(slug) + r'"[^>]*>.*?</li>'
          def update_card(match):
              card = match.group(0)
              card, count = re.subn(r'<img\b[^>]*>', '<img src="/assets/mall-over-the-years/' + photos[0]['name'] + '" alt="' + html.escape(photos[0]['alt'], quote=True) + '" width="1152" height="1536" loading="lazy" decoding="async">', card, count=1)
              if count != 1:
                  raise RuntimeError('The existing journal card has no image to replace.')
              return card
          blog, count = re.subn(card_pattern, update_card, blog, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError('Could not locate the existing mall-story journal card.')
          blog_path.write_text(blog, encoding='utf-8')
          taxonomy_path = root / 'data/journal-taxonomy.json'
          taxonomy = json.loads(taxonomy_path.read_text(encoding='utf-8'))
          entry = taxonomy['entries']['/' + slug]
          if 'photo-essays' not in entry['formats']:
              entry['formats'].append('photo-essays')
          taxonomy_path.write_text(json.dumps(taxonomy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          provenance = {'created':datetime.now(timezone.utc).date().isoformat(),'canonical_story':'https://anausomelife.com/' + slug,'authorization_basis':'The owner supplied these family photographs in this conversation and repeatedly explicitly requested their publication in this mall article with a note that they span different malls and years.','sources':[{'path':'assets/mall-over-the-years/' + p['name'],'source_filename':p['source'],'sha256':p['sha256'],'dimensions':[1152,1536],'alt':p['alt'],'alteration':'None; uploaded JPEG bytes preserved.'} for p in photos],'photo_rights':'Owner-authorized publication on the original An AUsome Life article and its ordinary on-site listing. No third-party family-media redistribution license.','excluded':'IMG_5289.png is a ride-pickup screenshot, not a family mall photograph; it contains unrelated driver and vehicle details and was not uploaded to the public website.'}
          (root / 'docs/mall-photos-provenance.json').write_text(json.dumps(provenance, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Embedded five original family photographs, captions, provenance note, and the journal thumbnail.')
          PY
      - name: Commit only the requested mall-story changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/mall-over-the-years/whitney-field-community.jpeg assets/mall-over-the-years/mall-pause-together.jpeg assets/mall-over-the-years/holiday-mall-afternoon.jpeg assets/mall-over-the-years/easter-bunny-2024.jpeg assets/mall-over-the-years/carousel-with-dad.jpeg the-beautiful-art-of-going-to-the-mall.html blog.html data/journal-taxonomy.json docs/mall-photos-provenance.json
          if git diff --cached --quiet; then
            echo 'The requested photos and gallery are already saved.'
          else
            git commit -m 'Embed the five original family mall photos with captions and provenance'
            git push origin HEAD:main
          fi
