name: Deploy An AUsome Life to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare original milk photographs and sharing image
        run: |
          python -m pip install --quiet Pillow lxml
          python .github/scripts/build_milk_social.py --root .

      - name: Validate story cards and editorial asset references
        run: |
          python tools/check_journal_picture_cards.py
          python tools/check_editorial_rights.py
          python tools/check_story_sharing.py
          python tests/test_story_sharing.py
          python -m py_compile tools/build_family_field_notes.py
          node --check assets/global-nav.js
          node --check assets/access-tools.js
          npm install --prefix /tmp/aal-access-tests --no-package-lock --no-audit --no-fund linkedom@0.18.13
          NODE_PATH=/tmp/aal-access-tests/node_modules node tests/test_access_tools.cjs
          python tests/test_access_publication.py
          python tests/test_reader_pathways.py
          python tests/test_growth_readiness.py
          python tests/test_reader_growth.py
          node --check assets/reader-growth.js
          node --check assets/analytics.js
          node tests/test_analytics.cjs
          node --check assets/inquiry-builder.js
          node tests/test_inquiry_builder.cjs
          node --check assets/story-share.js
          node --check assets/brand-room.js
          node tests/test_editorial_sharing.cjs
          node --check assets/card-catalog.js
          node --check assets/card-collection.js
          node --check assets/journal-picture-cards.js

      - name: Refresh search from the current editorial pages
        run: python tools/build_site_index.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare public files
        run: |
          mkdir -p _site
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='_site/' --exclude='*.md' --exclude='docs/' --exclude='tools/' --exclude='tests/' --exclude='scripts/' --exclude='services/' --exclude='*.py' --exclude='*.cjs' --exclude='*.example' --exclude='site-audit-report.json' ./ _site/

      - name: Apply current editorial navigation and sharing assets
        run: python .github/scripts/prepare_curated_edition.py --root _site

      - name: Publish evidence summaries and journal follow routes
        run: python .github/scripts/reader_growth.py --root _site

      - name: Prepare original-photo social previews
        run: |
          python .github/scripts/enrich_social_meta.py --root _site
          python .github/scripts/enrich_social_meta.py --root _site --check

      - name: Index the finished public edition
        run: python tools/build_site_index.py --root _site

      - name: Verify publishable site assets and navigation
        run: |
          python .github/scripts/site_audit.py --root _site --external-limit 0 --strict
          python .github/scripts/growth_readiness.py --root _site --check
          python .github/scripts/reader_growth.py --root _site --check

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
