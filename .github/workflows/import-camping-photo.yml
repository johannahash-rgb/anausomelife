name: Import original camping photograph
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-camping-photo.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-camping-photo
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Import and verify exact owner-uploaded JPEG
        env:
          PHOTO_URL: https://at.adobe.com/WDAmUw605uxpaKdy
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          path = pathlib.Path('assets/camping-swing/sunroom-stuffed-animals.jpeg')
          expected = '8134b58f19663fa845ad089cdc4b3dd6821afc115ee310ee7adaeb1415c9bbfc'
          if path.exists():
              data = path.read_bytes()
          else:
              with urllib.request.urlopen(os.environ['PHOTO_URL'], timeout=60) as response:
                  data = response.read(2000000)
          assert len(data) == 687930, 'Photo size differs from supplied original'
          assert hashlib.sha256(data).hexdigest() == expected, 'Photo hash differs from supplied original'
          assert data.startswith(b'\xff\xd8\xff'), 'Expected original JPEG'
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_bytes(data)
          print('Verified original photograph:', path, len(data), 'bytes')
          PY
      - name: Save only the verified photograph
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/camping-swing/sunroom-stuffed-animals.jpeg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add original family camping swing photograph without pixel changes'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
