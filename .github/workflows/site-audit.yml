name: Site-wide link and metadata audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate reviewed editorial share previews
        run: |
          python -m pip install --quiet Pillow
          python .github/scripts/enrich_social_meta.py --root . --check
          python -m unittest discover -s tests -p 'test_social_metadata.py'
      - name: Audit all HTML pages and local assets, and sample external links
        run: python .github/scripts/site_audit.py --root . --external-limit ${{ github.event_name == 'workflow_dispatch' && '750' || (contains(github.event.head_commit.message, '[check-external]') && '180') || '0' }}
      - name: Check calendar and navigation JavaScript syntax
        run: |
          node --check assets/events.js
          node --check assets/global-nav.js
          node --test tests/test_calendar_filters.cjs
      - name: Save full issue list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: site-audit-report.json
