name: Site-wide link and metadata audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Audit all HTML pages and local assets, and sample external links
        run: python .github/scripts/site_audit.py --root . --external-limit 120
      - name: Save full issue list
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-audit-report
          path: site-audit-report.json
